version: 2
updates:
  # One lockfile at the root covers app/, server/ and web/.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for the routine bumps; anything major still arrives on its own.
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /packages/server
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /packages/web
    schedule:
      interval: monthly
