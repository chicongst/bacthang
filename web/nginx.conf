server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Trang một file: mọi đường dẫn đều trả về index.html
    location / {
        try_files $uri /index.html;
    }

    # File có mã băm trong tên thì cache lâu, index.html thì không
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
