server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app: every path serves index.html
    location / {
        try_files $uri /index.html;
    }

    # Hashed filenames cache forever, index.html never does
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
